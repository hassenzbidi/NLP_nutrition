name: Deploy Nutrition App to Azure

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_CONTAINERAPP_NAME: nutrition-app
      AZURE_RESOURCE_GROUP: npl
      AZURE_CONTAINERAPP_ENV: npl-env
      CONTAINER_PORT: 8501

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login Azure avec le service principal stocké dans AZURE_CREDENTIALS
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Login à Azure Container Registry
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4️⃣ Build & push de l'image Docker vers ACR
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/nutrition-app:${{ github.sha }}"
          echo "Building image $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      # 5️⃣ Créer ou mettre à jour la Container App
      - name: Create or Update Azure Container App
        run: |
          set -e

          APP_NAME="${AZURE_CONTAINERAPP_NAME}"
          RG="${AZURE_RESOURCE_GROUP}"
          ENV_NAME="${AZURE_CONTAINERAPP_ENV}"
          IMAGE="${IMAGE_NAME}"
          PORT="${CONTAINER_PORT}"

          echo "Using image: $IMAGE"

          # Vérifier si la Container App existe déjà
          if az containerapp show --name "$APP_NAME" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Container App $APP_NAME exists, updating image..."
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --image "$IMAGE"
          else
            echo "Container App $APP_NAME does not exist, creating..."
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --environment "$ENV_NAME" \
              --image "$IMAGE" \
              --ingress external \
              --target-port "$PORT" \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}"
          fi