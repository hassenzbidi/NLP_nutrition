name: Deploy Nutrition App to Azure

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Azure login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Login to ACR
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4️⃣ Build and Push Docker image
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/nutrition-app:${{ github.sha }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      # 5️⃣ Deploy to Container App
      - name: Deploy to Azure Container App
        run: |
          APP_NAME="nutrition_container"
          RG="npl"
          ENV="env-mlops-workshop"
          IMAGE="$IMAGE_NAME"
          LOCATION="francecentral"

          # Vérifier si le Container App existe
          if az containerapp show --name $APP_NAME --resource-group $RG &> /dev/null; then
            echo "Container App $APP_NAME exists, updating image..."
            az containerapp update \
              --name $APP_NAME \
              --resource-group $RG \
              --image $IMAGE
          else
            echo "Container App $APP_NAME does not exist, creating..."
            az containerapp create \
              --name $APP_NAME \
              --resource-group $RG \
              --environment $ENV \
              --image $IMAGE \
              --target-port 80 \
              --location $LOCATION
          fi
